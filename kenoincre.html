<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Keno Incremental</title>

    <style>
/* Container for the grid */
#table {
  display: grid;
  border-collapse: collapse;
  border-spacing: 0;
  grid-template-columns: repeat(10, 30px); 
  width: fit-content;
  margin: 20px auto;
}

/* Each cell */
.cell {
  width: 30px;
  height: 30px;
  background-color: lightyellow;
  border: 1px solid #999;
  padding: 0;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  line-height: 30px;
  cursor: pointer;
  user-select: none;
}

/* Missed cell */
.cell.drawn {
  background-color: red;
}

/* Picked cell */
.cell.picked {
  background-color: lightblue;
}

/* Hit cell */
.cell.hit {
  background-color: green;
}

td.cell {
  position: relative; /* Needed for absolute positioning of ::before */
}

td.cell::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 22px;
  height: 22px;
  transform: translate(-50%, -50%);
  border: 2px solid blue;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  box-sizing: border-box;
}

td.cell.picked::before {
  opacity: 1;
}

.setting-row {
  display: flex;
  align-items: left;
  justify-content: left;
  gap: 10px; /* space between items */
  margin: 10px 0;
}

.setting-row button {
  font-size: 20px;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: none;
  background-color: gold;
  cursor: pointer;
  font-weight: bold;
  transition: background-color 0.2s;
}

.setting-row button:hover:not(:disabled) {
  background-color: orange;
}

.setting-row span {
  font-size: 16px;
  font-weight: bold;
  min-width: 160px;
  text-align: center;
}


#ui-panels {
  max-width: 600px;
  margin: 30px auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.panel {
  background: #111;
  border: 2px solid #333;
  border-radius: 12px;
  padding: 16px;
  color: #eee;
}

.panel h2 {
  margin-top: 0;
  font-size: 1.2rem;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}

/* Upgrade buttons */
.upgrade-btn,
.prestige-btn {
  width: 100%;
  background: #222;
  color: #eee;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 12px;
  margin-top: 10px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.upgrade-btn:hover {
  background: #2d2d2d;
}

/* Cost text */
.cost {
  font-size: 0.85rem;
  opacity: 0.7;
}

/* Prestige visual difference */
.prestige {
  border-color: gold;
  background: linear-gradient(145deg, #1a1400, #0d0a00);
}

/* Hidden panels */
.hidden {
  display: none;
}
</style>

  </head>
  <body>
    <div id="game-container">
      <h1>KN</h1>

      <div id="table"> </div>
      

      <div class="display">
        <div id="moneyDisplay">Money: $0</div>
        <p id="feedback"></p>
      </div>

      <div class="controls">
        <button id="playBtn">Play!</button>
        <button id="clearBtn">Clear All</button>
        <button id="debugResetBtn">Debug Reset</button>
      </div>

      <div id="ui-panels">
        <!-- UPGRADES -->
        <section id="upgradesPanel" class="panel">
          <h2>Upgrades</h2>

          <button class="upgrade-btn" id="upgradeDrawSpeed">
            Faster Draw Speed
            <span class="cost">$100</span>
          </button>

          <button class="upgrade-btn" id="upgradeAutoPlay">
            Autoplay
            <span class="cost">$1,000</span>
          </button>
        </section>

        <!-- AUTOMATION -->
        <section id="automationPanel" class="panel hidden">
          <h2>Automation</h2>

          <button class="upgrade-btn">
            Auto Pick Numbers
            <span class="cost">$10,000</span>
          </button>
        </section>

        <!-- PRESTIGE -->
        <section id="prestigePanel" class="panel hidden prestige">
          <h2>Prestige</h2>

          <p>Reset everything and open a VIP casino.</p>

          <button class="prestige-btn">Enter VIP Room</button>
        </section>
      </div>
    </div>
    
<script>
// ==== GLOBALs + CONSTANTS ====

let playerPicks = [];
// let playerMoney = 0;
let bet = 1;
let gameRunning = false;
let generatedNumbers = [];


// ==== UPGRADABLES ==== (those in brackets are KIV)
let winningMultiplier = 1; // each next one is 2x
let roundInterval = 3000; // each subsequent upgrade is -50. floor is 1000?
//let drawInterval = 1000; // each subsequent upgrade is -50. floor is 200
let baseDrawInterval = 1000
let drawnNumbers = 10 // ++, max 20? increases the chance of winning
let boardSize = 80 // -10 per upgrade, to 40? keep drawnnumbers as well? then much higher chance of winning



// ==== AUTOMATION ====
let roundsUpgrade = false; // just one upgrade to continuous. then it allows for round interval upgrades
// let autoPick = false; // player can choose own 10 numbers, or toggle on or off for auto pick 10 numbers for every round? or make it asshole-y and first upgrade is autopick but it's for every round, then next one is to keep the numbers from the previous round. 
// let autoCollect = false; // collects the round's currencyB

let upgrade_defs = {
autoPlay: {
type: "boolean",
cost: 10,
},
};


// ==== NOTES ====
// currencyA = winning $, unlocks upgrades. updated as gameState.currency.money
// currencyB = points? for automation. can be autocollected
// currencyC = gold? for prestiging


// ==== SOUNDS ====
const sfxDraw = new Audio("sounds/draw.ogg");
const sfxHit  = new Audio("sounds/hit.ogg");
const sfxWin  = new Audio("sounds/win.wav");
const sfxLose = new Audio("sounds/lose.wav");


// ==== INITIALISATION + GENERATION OF STUFF ====
document.addEventListener("DOMContentLoaded", initialise);

function initialise() {
  loadGame();
  generateGrid(boardSize)
  attachListeners();
  updateMoneyDisplay();
}

function generateGrid(boardSize) {
let table = document.getElementById("table")
table.innerHTML = ""

for (let i = 1; i <= boardSize; i++) {
const td = document.createElement("div")
// const td = document.createElement("td")
td.className = "cell"
td.id = "cell" + i
td.textContent = i
table.appendChild(td)
}
enableInputs()
}


// ==== GAME STATE ==== 
// Keeps all status. Read and write to this, calculate based on this
 const gameState = {
  currency: {
     money: 0,
     prestige: 0,
   },

  upgrades: {
    autoPlay: false,
 //   autoPick: false,
    fasterDraw: 0,     // level, not ms
 //   fasterRounds: 0,  // level
//    ballsDrawn: 10,    // starts at 10, upgrades increase
    boardSize: 80,
   },

//  stats: {
//     totalRounds: 0,
//    totalWins: 0,
//  }
 };

function applyUpgrades() {
roundsUpgrade = gameState.upgrades.autoPlay == true
}

function getDrawInterval() {
return Math.max(200, baseDrawInterval - gameState.upgrades.fasterDraw * 50) // upgrades to keep as a level so every level is -50
}


// ==== BUYING UPGRADES ====
function buyAutoPlay() {
let cost = upgrade_defs.autoPlay.cost

if (gameState.upgrades.autoPlay) return // either hide the button or change colour and disable it later
if (gameState.currency.money < cost) return

gameState.currency.money -= cost
gameState.upgrades.autoPlay = true

roundsUpgrade = true
applyUpgrades()

updateMoneyDisplay()
saveGame()
}



// ==== GAME LOGIC (pure Keno) ====
// player picking numbers. numbers are circled.
function toggleCell(e) {
  if (gameRunning) return;
  let clickedCell = e.target;
  let pickValue = parseInt(clickedCell.id.replace("cell", ""));

  // if already picked
  if (clickedCell.classList.contains("picked")) {
    clickedCell.classList.remove("picked");
    playerPicks = playerPicks.filter((n) => n !== pickValue);
  } else {
    if (playerPicks.length >= 10) return;
    clickedCell.classList.add("picked");
    playerPicks.push(pickValue);
  }
}

// comp generating winning numbers
function generateWinners(onFinish) {
  generatedNumbers = []; // need this to reset for the round
  let count = 1;

  function generateNext() {
    if (count >= drawnNumbers) {
      onFinish(); // trigger next round only after 10 numbers are generated
      return;
    }

    let num = Math.ceil(Math.random() * 80);
    if (!generatedNumbers.includes(num)) {
      generatedNumbers.push(num);
      let cell = document.getElementById("cell" + num);

      if (cell) {
        // diff sounds and display
        if (cell.classList.contains("picked")) {
          sfxHit.currentTime = 0;
          sfxHit.play();
          cell.classList.add("hit");
        } else {
          sfxDraw.currentTime = 0;
          sfxDraw.play();
          cell.classList.add("drawn");
        }
      }
      count++;
    }
    setTimeout(generateNext, getDrawInterval());
  }
  generateNext(); // first one to start off the chain
}

function comparePicks() {
  let hits = document.querySelectorAll(".hit").length;
  let hitIndex = hits - 1;
  let feedbackText = "";
  let picks = playerPicks.length;
  let payoutMultiplier = payoutTable[picks]?.[hitIndex] || 0;
  let winnings = bet * payoutMultiplier;

  if (winnings == 0) {
    sfxLose.currentTime = 0;
    sfxLose.play();
    feedbackText = `Sorry, you matched ${hits} number${
      hits === 1 ? "" : "s"
    }, which is not enough to win.`;
  } else if (winnings > 0) {
    sfxWin.currentTime = 0;
    sfxWin.play();
    feedbackText = `You won $${winnings.toLocaleString()} for matching ${hits} number${
      hits === 1 ? "" : "s"
    }!`;
  }
  // Update feedback in HTML
  document.getElementById("feedback").textContent = feedbackText;
  gameState.currency.money += winnings;
  updateMoneyDisplay();
}

function playGame() {
if (playerPicks.length == 0) return;
if (!roundsUpgrade) {
resetBoard()
singleRound()
} else {
multipleRounds()
}}


function singleRound() {
  gameRunning = true;
  disableInputs();
generateWinners(() => {
      comparePicks();
})
return
}

function multipleRounds() {
if (playerPicks.length == 0) return;
gameRunning = true;
  disableInputs();
    updateMoneyDisplay();
    resetBoard();
generateWinners(() => {
      comparePicks();
      setTimeout(playGame, roundInterval); // pause between rounds
    });
  
  playGame();
}


function resetBoard() {
  let cells = document.querySelectorAll("td");
  cells.forEach((cell) => {
    cell.classList.remove("hit", "drawn");
  });
  generatedNumbers = [];
}

function updateMoneyDisplay() {
  document.getElementById(
    "moneyDisplay"
  ).textContent = `Money: $${gameState.currency.money.toLocaleString()}`;
}

function clearPicks() {
  let cells = document.querySelectorAll("td");
  cells.forEach((cell) => {
    cell.classList.remove("hit", "drawn", "picked");
  });
  playerPicks = [];
  generatedNumbers = [];
}

// ==== UI + INTERACTION ====

function disableInputs() {
  document.getElementById("clearBtn").removeEventListener("click", clearPicks);

  document.querySelectorAll(".cell").forEach((cell) => {
    cell.removeEventListener("click", toggleCell);
  });
}

function enableInputs() {
  document.querySelectorAll(".cell").forEach((cell) => {
    cell.addEventListener("click", toggleCell);
  });
}

function attachListeners() {
  enableInputs();

  // play!
  document.getElementById("playBtn").addEventListener("click", playGame);

  document.getElementById("clearBtn").addEventListener("click", clearPicks);
  document.getElementById("debugResetBtn").addEventListener("click", hardReset);

// buttons for upgrades
  document.getElementById("upgradeAutoPlay").addEventListener("click", buyAutoPlay);
   
}



// ==== PAYOUT TABLE ====
let payoutTable = {
  1: [8],
  2: [2, 38],
  3: [2, 7, 80],
  4: [2, 3, 10, 300],
  5: [1.5, 3, 5, 50, 2000],
  6: [1.5, 2, 4, 10, 200, 4000],
  7: [0, 3, 10, 25, 150, 1000, 5000],
  8: [0, 2, 7, 20, 200, 500, 1000, 10000],
  9: [0, 2, 5, 10, 70, 200, 1000, 10000, 50000],
  10: [1, 2, 3, 10, 50, 500, 5000, 10000, 50000, 100000],
};

    // ==== SAVE GAME ====
function saveGame() {
  localStorage.setItem("KenoIncrementalSave", JSON.stringify(gameState));
}


function loadGame() {
  const raw = localStorage.getItem("KenoIncrementalSave");
  if (!raw) return;

  const data = JSON.parse(raw);

Object.assign(gameState.currency, data.currency ?? {})
Object.assign(gameState.upgrades, data.upgrades ?? {})

  applyUpgrades()
//  generategrid(boardSize)
  updateMoneyDisplay();
}


function hardReset() { // just for debugging tests
  localStorage.removeItem("KenoIncrementalSave");
  location.reload();
}

</script>
    
  </body>
</html>
